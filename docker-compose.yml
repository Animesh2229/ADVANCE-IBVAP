version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ibvap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibvap}
      POSTGRES_DB: ibvap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles: ["redis"]

  central:
    build: ./central
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ibvap:${POSTGRES_PASSWORD:-ibvap}@db:5432/ibvap
      SECRET_KEY: ${SECRET_KEY:-ibvap-change-this-in-production-very-secret-key-32chars}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      EDGE_FERNET_KEY: ${EDGE_FERNET_KEY}
      EDGE_HMAC_SECRET: ${EDGE_HMAC_SECRET}
      REDIS_URL: ${REDIS_URL:-}
      C2_WEBHOOK_URL: ${C2_WEBHOOK_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FUSION_STATE_PATH: /data/fusion_state.json
    volumes:
      - central_data:/data
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
  central_data:
