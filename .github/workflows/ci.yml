name: IBVAP CI

on:
  push:
    branches: [main, master, v1.1-improved, "defense/**"]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install central test deps
        run: |
          pip install pytest cryptography numpy
      - name: Run central tests
        run: |
          cd central
          PYTHONPATH=. pytest tests/ -v --tb=short

  edge-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal edge deps
        run: |
          pip install numpy pytest cryptography requests
      - name: Run edge smoke tests
        env:
          EDGE_FERNET_KEY: "dGVzdC1mZXJuZXQta2V5LWZvci1jaS1vbmx5LTEyMzQ1Njc4OTA="
          EDGE_HMAC_SECRET: "ci-hmac-secret-for-tests-only"
        run: |
          cd edge
          PYTHONPATH=. pytest tests/ -v --tb=short

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & Build Dashboard
        working-directory: dashboard
        run: |
          npm install --legacy-peer-deps
          npm run build
